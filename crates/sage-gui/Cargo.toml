[package]
name = "sage-gui"
version = "1.9.10"
edition = "2021"
description = "Desktop front-end for editing Sage search settings and running searches"
license = "MIT"

[[bin]]
name = "sage-gui"
path = "src/main.rs"

[dependencies]
# the window is drawn with Direct3D 12 (wgpu; works over Remote Desktop and in
# virtual machines, Windows' software renderer when there is no graphics
# card), or OpenGL (glow) when asked or as a last resort (display.rs)
eframe = { version = "0.31", features = ["wgpu"] }
# eframe's wgpu has no backend of its own on Windows: Direct3D 12
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
rfd = "0.15"
roxmltree = "0.20"
serde_json = "1.0"
# Circos plot styles, saved as JSON
serde = { version = "1.0", features = ["derive"] }
ureq = "2.12"
# UniProt's answers can come gzipped twice (ureq undoes one layer)
flate2 = "1"
# results.json lists the output files as file:// URLs (spaces as %20)
url = "2"
egui_plot = "0.31"
# Spectrum viewer: spectra are read exactly as Sage read them...
sage-core = { path = "../sage" }
sage-cloudpath = { path = "../sage-cloudpath" }
# ...and annotated by Annotator's engine (github.com/snijderlab/annotator):
# ProForma 2.0 incl. crosslinks (mzcore), fragmentation and matching (mzannotate)
mzcore = "0.2"
mzannotate = "0.2"
mzdata = { version = "0.65", default-features = false, features = ["miniz_oxide"] }
# Figure export: SVG rendered to PNG / TIFF
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
# PDF export of figures (shares usvg 0.45 with resvg)
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
# Local xiVIEW: a small HTTP server on 127.0.0.1 serving the xiVIEW web app
# and XNova's results in the form of its data API
tiny_http = "0.12"
# ...opened in the default web browser (the one registered for http)
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    # the user's date and time formats, for the log (GetDateFormatEx, GetTimeFormatEx)
    "Win32_Globalization",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    # XNova's own processes for the usage meters (process snapshot, working sets)
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # message boxes when the window cannot open or stopped (display.rs)
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
# build.rs embeds assets/xnova.ico as the .exe icon
winresource = "0.1"

[dev-dependencies]
# headless rendering of the window for screenshots (tests only)
egui_kittest = { version = "0.31.1", features = ["wgpu"] }
